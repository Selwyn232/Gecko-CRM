name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gecko
          POSTGRES_PASSWORD: gecko
          POSTGRES_DB: gecko_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gecko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gecko:gecko@localhost:5432/gecko_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Controleer dat migraties bij het schema horen
        working-directory: apps/api
        run: |
          pnpm db:generate
          git diff --exit-code drizzle/ || (echo "Schema gewijzigd zonder migratie: draai 'pnpm db:generate' en commit het resultaat" && exit 1)
      - run: pnpm test
      - run: pnpm build
